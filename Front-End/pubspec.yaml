name: tokokita
description: Aplikasi katalog produk TokoKita berbasis Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.5
  image_picker: ^1.1.2
  material_ui: ^1.11.1
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
